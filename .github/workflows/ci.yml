# Checks on every pull request and on main. Actions are pinned by commit, the
# token is read-only, and pull requests use no secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: No floats in the ledger
        run: |
          if grep -rnE 'float(32|64)|ParseFloat' internal/ledger; then exit 1; fi
      - name: Only the ledger writes transactions
        run: |
          if grep -rniE '(insert into|update|delete from) +transactions' --include='*.go' --exclude-dir=ledger .; then
            exit 1
          fi
      - name: Only internal/nwc uses go-nostr
        run: |
          if grep -rl 'getAlby/go-nostr' --include='*.go' . | grep -v '^./internal/nwc/'; then exit 1; fi
      - name: Test
        run: go test -race ./...
      - name: Build without C
        run: CGO_ENABLED=0 go build ./...

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Its Go cache is off: a lightning-fork build fills it with 3 GB. Only the
      # finished binaries are worth keeping.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/nwc4ln-it
          key: nwc4ln-it-${{ runner.os }}-${{ hashFiles('test/integration/versions.env') }}
      - name: Set the data folder
        run: echo "NWC4LN_IT_DIR=$RUNNER_TEMP/nwc4ln-it" >> "$GITHUB_ENV"
      - name: Vet with the integration tag
        run: go vet -tags integration ./...
      - name: Start the network
        run: go run ./test/integration/cmd/regtest up
      - name: Test
        run: go test -tags integration -p 1 -count=1 -timeout 10m ./test/integration/...
      - name: Show logs
        if: failure()
        run: tail -n 60 "$NWC4LN_IT_DIR"/*.log
      - name: Stop the network
        if: always()
        run: go run ./test/integration/cmd/regtest down
